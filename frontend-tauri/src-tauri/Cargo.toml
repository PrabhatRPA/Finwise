[package]
name = "finwise"
version = "1.1.1"
description = "Finwise — Privacy-first personal finance dashboard"
authors = ["Personal Finance Team"]
license = "MIT"
edition = "2021"

# Expose lib so main.rs can call personal_finance_lib::run()
[lib]
name = "personal_finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-shell  = "2"   # sidecar spawn + shell::open
tauri-plugin-dialog = "2"   # native message dialog for Ollama warning
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
