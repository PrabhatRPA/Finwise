[package]
name = "finwise"
version = "1.3.6"
description = "Finwise — Privacy-first personal finance dashboard by Rao Tech LLC"
authors = ["Prabhat Kumar <prabhat_kumar_p@hotmail.com>"]
license = "MIT"
edition = "2021"

# Expose lib so main.rs can call personal_finance_lib::run()
[lib]
name = "personal_finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-shell  = "2"   # sidecar spawn + shell::open
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
chrono            = { version = "0.4", features = ["clock"] }
tokio             = { version = "1", features = ["time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
