name: Release

# Triggers whenever you push a version tag like v1.0.0, v1.1.0, v2.0.0
on:
  push:
    tags:
      - 'v*'

# Opt into Node.js 24 for all GitHub-hosted action runners now,
# ahead of the forced migration on June 2, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Needed so the workflow can create a GitHub Release and upload files
permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    strategy:
      fail-fast: false   # if Windows fails, macOS still finishes and vice-versa
      matrix:
        include:

          # ── macOS (Apple Silicon — M1 / M2 / M3) ──────────────────────────
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            python-version: '3.13'
            bundle-subdir: dmg
            bundle-glob: '*.dmg'

          # ── Windows (64-bit) ───────────────────────────────────────────────
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            python-version: '3.11'
            bundle-subdir: nsis
            bundle-glob: '*-setup.exe'

    runs-on: ${{ matrix.platform }}

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Language toolchains ─────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Cache compiled Rust crates — saves ~5 min on repeat builds
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend-tauri/src-tauri -> target

      # ── 3. Tauri CLI (pre-built npm binary — ~30 s vs ~8 min from source) ──
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # ── 4. Build the Python FastAPI backend into a single binary ───────────
      - name: Install Python dependencies
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: PyInstaller — package backend
        shell: bash
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean --noconfirm

      - name: Place sidecar in Tauri binaries folder
        shell: bash
        run: |
          DEST="frontend-tauri/src-tauri/binaries"
          mkdir -p "$DEST"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # onedir: launcher binary is dist/backend/backend
            cp backend/dist/backend/backend "$DEST/backend-${{ matrix.rust-target }}"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cp backend/dist/backend.exe "$DEST/backend-${{ matrix.rust-target }}.exe"
          else
            cp backend/dist/backend "$DEST/backend-${{ matrix.rust-target }}"
          fi
          echo "✓ Sidecar placed:"
          ls -lh "$DEST"

      # ── 5. Build Next.js into a static export (goes to frontend/out/) ──────
      - name: Install frontend npm packages
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (static export)
        shell: bash
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

      # ── 6. Build the Tauri desktop app ─────────────────────────────────────
      - name: Build Tauri app
        shell: bash
        working-directory: frontend-tauri/src-tauri
        env:
          # Ad-hoc sign on macOS so Gatekeeper shows "unidentified developer"
          # (bypassable with right-click → Open) instead of "damaged" (not bypassable).
          # On Windows this env var is ignored.
          APPLE_SIGNING_IDENTITY: "-"
        run: tauri build

      # ── 6b. macOS post-build: place _internal/ at Contents/Frameworks/, sign, DMG ─
      # Inside a .app bundle, dyld restricts framework lookup to
      # @executable_path/../Frameworks/ and ignores PyInstaller's _MEIPASS-based
      # fallback. So PyInstaller's entire _internal/ directory must land at
      # Contents/Frameworks/ — that puts the flat Python symlink where dyld
      # expects it AND keeps base_library.zip + the rest of the support files
      # next to it so PYTHONHOME calculations stay coherent.
      #
      # The sidecar binary must remain byte-identical to the PyInstaller-built
      # original. codesign mutates the Mach-O irreversibly (signature +
      # identifier), and that breaks PyInstaller's bootloader inside an .app
      # bundle. We copy the pristine binary back over after the bundle re-sign.
      - name: Place _internal/ at Frameworks/, restore pristine sidecar, sign and DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUNDLE_DIR="frontend-tauri/src-tauri/target/release/bundle"
          PRODUCT_NAME=$(python3 -c "import json; print(json.load(open('frontend-tauri/src-tauri/tauri.conf.json'))['productName'])")
          APP="$BUNDLE_DIR/macos/$PRODUCT_NAME.app"
          echo "App bundle: $APP"
          ls -lh "$APP/Contents/MacOS/"

          # Inside a .app bundle, dyld restricts framework lookup to
          # @executable_path/../Frameworks/. DYLD_FRAMEWORK_PATH and PyInstaller's
          # own _MEIPASS-based fallback are ignored. So we copy PyInstaller's
          # entire _internal/ directory into Contents/Frameworks/: the flat
          # `Python` symlink lands at Contents/Frameworks/Python (where dyld
          # expects it) and base_library.zip + the rest of PyInstaller's
          # support files sit next to it, so PYTHONHOME calculations stay
          # coherent.
          #
          # The sidecar binary is LEFT UNSIGNED (as PyInstaller built it).
          # Ad-hoc signing it with Hardened Runtime causes dyld to ignore
          # the framework search path PyInstaller relies on; plain ad-hoc
          # signing also breaks things on macOS 15.
          INTERNAL_SRC="backend/dist/backend/_internal"
          echo "Copying _internal/ contents into Contents/Frameworks/ ..."
          mkdir -p "$APP/Contents/Frameworks"
          cp -R "$INTERNAL_SRC"/. "$APP/Contents/Frameworks/"
          echo "✓ $(ls "$APP/Contents/Frameworks/" | wc -l | tr -d ' ') items in Contents/Frameworks/"

          # Re-sign the bundle to cover the newly added _internal/ files.
          # --no-strict: PyInstaller adds *.dist-info dirs that codesign mistakes
          # for malformed bundles; without --no-strict codesign exits 1 and aborts.
          codesign --force --sign - --no-strict "$APP" 2>&1 | grep -v "bundle format unrecognized" || true
          echo "✓ App bundle signed"

          # CRITICAL: Restore the sidecar to the pristine PyInstaller binary
          # AFTER any codesign step. Both Tauri's build and our bundle re-sign
          # mutate the Mach-O (signature + identifier). `codesign --remove-signature`
          # does NOT restore the original bytes; the bootloader still misbehaves
          # inside a .app bundle. Only the byte-identical original binary works.
          cp backend/dist/backend/backend "$APP/Contents/MacOS/backend"
          echo "✓ Sidecar restored to pristine PyInstaller binary (unsigned)"

          # Build the DMG from the modified app bundle
          VERSION=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          DMG_DIR="$BUNDLE_DIR/dmg"
          mkdir -p "$DMG_DIR"
          DMG_PATH="$DMG_DIR/Finwise_${VERSION}_aarch64.dmg"
          hdiutil create -volname "Finwise" -srcfolder "$APP" -ov -format UDZO "$DMG_PATH"
          codesign --sign - "$DMG_PATH"
          echo "✓ DMG: $DMG_PATH"

      # ── 7. Locate the installer produced by the bundler ────────────────────
      - name: Locate installer artifact
        id: installer
        shell: bash
        run: |
          BUNDLE_DIR="frontend-tauri/src-tauri/target/release/bundle/${{ matrix.bundle-subdir }}"
          FILE=$(find "$BUNDLE_DIR" -name "${{ matrix.bundle-glob }}" 2>/dev/null | head -1)

          # Windows fallback: try MSI if NSIS wasn't produced
          if [[ -z "$FILE" && "$RUNNER_OS" == "Windows" ]]; then
            FILE=$(find "frontend-tauri/src-tauri/target/release/bundle/msi" -name "*.msi" 2>/dev/null | head -1)
          fi

          if [[ -z "$FILE" ]]; then
            echo "ERROR: No installer found in $BUNDLE_DIR"
            exit 1
          fi

          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "✓ Installer: $FILE"

      # ── 8. Publish a GitHub Release and attach the installer ───────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Finwise ${{ github.ref_name }}
          files: ${{ steps.installer.outputs.path }}
          body: |
            ## Finwise ${{ github.ref_name }}

            **Developed by Prabhat Kumar — Rao Tech LLC**

            | Platform | File to download | Requires |
            |----------|-----------------|----------|
            | **macOS** (Apple Silicon) | `Finwise_*_aarch64.dmg` | macOS 10.15 Catalina or later |
            | **Windows** (64-bit) | `Finwise_*_x64-setup.exe` | Windows 10 / 11 (64-bit) |

            ### Installing for the first time
            - **macOS** — Open the `.dmg`, drag **Finwise** into your Applications folder. On first launch right-click → **Open** to bypass the Gatekeeper warning (app is ad-hoc signed, not Apple-notarised yet).
            - **Windows** — Run the `-setup.exe` installer. If Windows SmartScreen appears, click **More info → Run anyway**. When prompted, choose **Install for me only** (no admin rights needed) or **Install for all users** (requires admin).

            ### Upgrading from an older version
            Install the new version on top of the old one — no need to uninstall first.
            Your data lives in a separate OS folder and is **never** touched by the installer:
            - macOS: `~/Library/Application Support/com.raotechllc.finwise/`
            - Windows: `%APPDATA%\com.raotechllc.finwise\`

            ### Troubleshooting startup issues
            If the app shows a "backend stopped" error, check the log at:
            - macOS: `~/Library/Application Support/com.raotechllc.finwise/sidecar.log`
            - Windows: `%APPDATA%\com.raotechllc.finwise\sidecar.log`

            ---
            *Automated build from tag `${{ github.ref_name }}`*
          draft: false
          prerelease: false
