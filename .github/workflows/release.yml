name: Release

# Triggers whenever you push a version tag like v1.0.0, v1.1.0, v2.0.0
on:
  push:
    tags:
      - 'v*'

# Opt into Node.js 24 for all GitHub-hosted action runners now,
# ahead of the forced migration on June 2, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Needed so the workflow can create a GitHub Release and upload files
permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    strategy:
      fail-fast: false   # if Windows fails, macOS still finishes and vice-versa
      matrix:
        include:

          # ── macOS (Apple Silicon — M1 / M2 / M3) ──────────────────────────
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            python-version: '3.13'
            bundle-subdir: dmg
            bundle-glob: '*.dmg'

          # ── Windows (64-bit) ───────────────────────────────────────────────
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            python-version: '3.11'
            bundle-subdir: nsis
            bundle-glob: '*-setup.exe'

    runs-on: ${{ matrix.platform }}

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Language toolchains ─────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Cache compiled Rust crates — saves ~5 min on repeat builds
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend-tauri/src-tauri -> target

      # ── 3. Tauri CLI (pre-built npm binary — ~30 s vs ~8 min from source) ──
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # ── 4. Build the Python FastAPI backend into a single binary ───────────
      - name: Install Python dependencies
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      # macOS: strip python.org code signature from the Python shared library
      # before PyInstaller packages it.  PyInstaller embeds the dylib in the
      # one-file binary; at runtime it extracts it to /tmp and dlopen()s it.
      # macOS refuses to load a signed dylib whose Team ID differs from the
      # loading process.  An unsigned dylib has no Team ID → loads freely.
      - name: Strip Python dylib signature (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 << 'PYEOF'
          import subprocess, sys, os, sysconfig, ctypes.util

          candidates = set()

          # Framework layout (python.org official installer)
          fd = sysconfig.get_config_var('PYTHONFRAMEWORKDIR')
          if fd:
              ver = f'{sys.version_info.major}.{sys.version_info.minor}'
              candidates.add(os.path.join(fd, 'Versions', ver, 'Python'))

          # Unix-style layout (hostedtoolcache / homebrew)
          libdir = sysconfig.get_config_var('LIBDIR')
          ldlib  = sysconfig.get_config_var('LDLIBRARY')
          if libdir and ldlib:
              candidates.add(os.path.join(libdir, ldlib))
              # Also resolve symlinks — the real dylib may be a versioned file
              full = os.path.realpath(os.path.join(libdir, ldlib))
              candidates.add(full)

          # ctypes lookup as a fallback
          for suffix in [f'{sys.version_info.major}.{sys.version_info.minor}',
                         str(sys.version_info.major)]:
              lib = ctypes.util.find_library(f'python{suffix}')
              if lib and os.path.exists(lib):
                  candidates.add(lib)
                  candidates.add(os.path.realpath(lib))

          found_any = False
          for path in candidates:
              if not os.path.exists(path):
                  continue
              found_any = True
              r = subprocess.run(['codesign', '--remove-signature', path],
                                 capture_output=True)
              if r.returncode == 0:
                  print(f'✓ stripped  {path}')
              else:
                  msg = r.stderr.decode().strip()
                  # "no signature" is fine — nothing to strip
                  if 'no signature' in msg.lower() or 'not signed' in msg.lower():
                      print(f'– unsigned  {path}  (nothing to strip)')
                  else:
                      print(f'✗ failed    {path}: {msg}')

          if not found_any:
              print('WARNING: Python shared library not found — skipping signature strip')
          PYEOF

      - name: PyInstaller — package backend
        shell: bash
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean --noconfirm

      - name: Place sidecar in Tauri binaries folder
        shell: bash
        run: |
          DEST="frontend-tauri/src-tauri/binaries"
          mkdir -p "$DEST"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp backend/dist/backend.exe "$DEST/backend-${{ matrix.rust-target }}.exe"
          else
            cp backend/dist/backend "$DEST/backend-${{ matrix.rust-target }}"
          fi
          echo "✓ Sidecar placed:"
          ls -lh "$DEST"

      # ── 5. Build Next.js into a static export (goes to frontend/out/) ──────
      - name: Install frontend npm packages
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (static export)
        shell: bash
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

      # ── 6. Build the Tauri desktop app ─────────────────────────────────────
      - name: Build Tauri app
        shell: bash
        working-directory: frontend-tauri/src-tauri
        env:
          # Ad-hoc sign on macOS so Gatekeeper shows "unidentified developer"
          # (bypassable with right-click → Open) instead of "damaged" (not bypassable).
          # On Windows this env var is ignored.
          APPLE_SIGNING_IDENTITY: "-"
        run: tauri build

      # ── 6b. Sign the app bundle and DMG (macOS only) ──────────────────────
      # Sign the sidecar first WITH the disable-library-validation entitlement
      # (belt-and-suspenders alongside the dylib signature strip above), then
      # sign the full bundle and DMG.  We avoid --deep on the bundle because
      # it would overwrite the sidecar's entitlements with a plain ad-hoc sign.
      - name: Ad-hoc sign app bundle and DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BUNDLE_DIR="frontend-tauri/src-tauri/target/release/bundle"
          APP=$(find "$BUNDLE_DIR/macos" -name "*.app" -maxdepth 1 | head -1)
          DMG=$(find "$BUNDLE_DIR/dmg"   -name "*.dmg" -maxdepth 1 | head -1)

          # Write entitlements that allow loading unsigned/differently-signed dylibs
          cat > /tmp/sidecar.entitlements.plist << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          ENTEOF

          if [ -n "$APP" ]; then
            # Sign the sidecar binary with Hardened Runtime + entitlements
            SIDECAR=$(find "$APP" -name "backend-*" -type f | head -1)
            if [ -n "$SIDECAR" ]; then
              echo "Signing sidecar with entitlements: $SIDECAR"
              codesign --force --options runtime \
                        --entitlements /tmp/sidecar.entitlements.plist \
                        --sign - "$SIDECAR"
            fi

            # Sign all other nested executables/dylibs inside the bundle
            find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) | while read -r lib; do
              codesign --force --sign - "$lib" 2>/dev/null || true
            done

            # Sign the main app binary
            MAIN_BIN="$APP/Contents/MacOS/Finwise"
            if [ -f "$MAIN_BIN" ]; then
              codesign --force --sign - "$MAIN_BIN"
            fi

            # Sign the app bundle itself (without --deep to preserve inner entitlements)
            echo "Signing app bundle: $APP"
            codesign --force --sign - "$APP"
          fi

          if [ -n "$DMG" ]; then
            echo "Signing DMG: $DMG"
            codesign --sign - "$DMG"
          fi
          echo "✓ Ad-hoc signing complete"

      # ── 7. Locate the installer produced by the bundler ────────────────────
      - name: Locate installer artifact
        id: installer
        shell: bash
        run: |
          BUNDLE_DIR="frontend-tauri/src-tauri/target/release/bundle/${{ matrix.bundle-subdir }}"
          FILE=$(find "$BUNDLE_DIR" -name "${{ matrix.bundle-glob }}" 2>/dev/null | head -1)

          # Windows fallback: try MSI if NSIS wasn't produced
          if [[ -z "$FILE" && "$RUNNER_OS" == "Windows" ]]; then
            FILE=$(find "frontend-tauri/src-tauri/target/release/bundle/msi" -name "*.msi" 2>/dev/null | head -1)
          fi

          if [[ -z "$FILE" ]]; then
            echo "ERROR: No installer found in $BUNDLE_DIR"
            exit 1
          fi

          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "✓ Installer: $FILE"

      # ── 8. Publish a GitHub Release and attach the installer ───────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Finwise ${{ github.ref_name }}
          files: ${{ steps.installer.outputs.path }}
          body: |
            ## Finwise ${{ github.ref_name }}

            **Developed by Prabhat Kumar — Rao Tech LLC**

            | Platform | File to download | Requires |
            |----------|-----------------|----------|
            | **macOS** (Apple Silicon) | `Finwise_*_aarch64.dmg` | macOS 10.15 Catalina or later |
            | **Windows** (64-bit) | `Finwise_*_x64-setup.exe` | Windows 10 / 11 (64-bit) |

            ### Installing for the first time
            - **macOS** — Open the `.dmg`, drag **Finwise** into your Applications folder. On first launch right-click → **Open** to bypass the Gatekeeper warning (app is ad-hoc signed, not Apple-notarised yet).
            - **Windows** — Run the `-setup.exe` installer. If Windows SmartScreen appears, click **More info → Run anyway**. When prompted, choose **Install for me only** (no admin rights needed) or **Install for all users** (requires admin).

            ### Upgrading from an older version
            Install the new version on top of the old one — no need to uninstall first.
            Your data lives in a separate OS folder and is **never** touched by the installer:
            - macOS: `~/Library/Application Support/com.raotechllc.finwise/`
            - Windows: `%APPDATA%\com.raotechllc.finwise\`

            ### Troubleshooting startup issues
            If the app shows a "backend stopped" error, check the log at:
            - macOS: `~/Library/Application Support/com.raotechllc.finwise/sidecar.log`
            - Windows: `%APPDATA%\com.raotechllc.finwise\sidecar.log`

            ---
            *Automated build from tag `${{ github.ref_name }}`*
          draft: false
          prerelease: false
